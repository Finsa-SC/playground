services:
  db:
    image: postgres:17
    container_name: bakery-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d/:ro
    networks:
      - db_net

  api:
    build: ./bakery-backend
    container_name: bakery-backend
    ports:
      - "8000:8000"
    env_file:
      - ./env/api.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./bakery-backend/storage/product-images:/app/storage/product-images
    networks:
      - db_net
      - public_net

  proxy:
    image: nginx:alpine
    container_name: bakery-proxy
    ports:
      - "80:80"
    volumes:
      - ./bakery-frontend:/usr/share/nginx/html/bakery:ro

      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_net
      - proxy_net

volumes:
  postgres_data:

networks:
  public_net:
    driver: bridge
  proxy_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true