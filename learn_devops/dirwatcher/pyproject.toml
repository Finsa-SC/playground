[project]
name = "dirwatcher"
version = "0.1.0"
description = "Polls configured directories for new/stable files and dispatches them to handlers (move/copy/log)."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
dirwatcher = "dirwatcher.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
