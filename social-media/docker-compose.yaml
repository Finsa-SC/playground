services:
  db:
    image: postgres:17
    container_name: sosmed-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net

  api:
    container_name: sosmed-api
    build: ./api/
    ports:
      - "8100:8100"
    env_file:
      - ./env/api.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./storage:/app/storage
    networks:
      - public_net
      - api_net
      - db_net

  proxy:
    container_name: sosmed-proxy
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
    depends_on:
      - api
    networks:
      - api_net
      - public_net

volumes:
  postgres_data:

networks:
  public_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true
  api_net:
    driver: bridge
    internal: true