[project]
name = "finsky-api"
version = "0.1.0"
description = "Modular FastAPI backend for FinSky social media"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "email-validator>=2.2,<3.0"
]
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.9"]
[tool.ruff]
line-length = 100
target-version = "py312"
